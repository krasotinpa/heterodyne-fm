body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.b{transition:none}
.b:active:not(:disabled){box-shadow:inset 0 0 0 3px currentColor,inset 0 0 0 300px rgba(128,128,128,.30);transform:translateY(1px) scale(.98)}
.b:disabled{cursor:default}
.b:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sc{scrollbar-width:thin}
.rib{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.rib::-webkit-scrollbar{display:none}
.rib>*{scroll-snap-align:start}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq{display:inline-block;white-space:nowrap;animation:mq 18s linear 2 forwards}
@keyframes sp{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
a{color:inherit}

html,body{margin:0;background:#0A0A0B;color:#EDEDF0}
.stage{display:flex;flex-direction:column;align-items:center;gap:0;padding:12px 0 32px;min-width:max-content}
.panel{width:1100px;box-sizing:border-box;margin-top:4px;padding:14px 16px;border-radius:14px;background:#17171A;border:1px solid #2C2C31;font:14px/1.4 'Golos Text',system-ui,sans-serif;color:#D6D6DC;display:flex;flex-direction:column;gap:10px}
.ph{color:#A9A9B2}
.pr{display:flex;gap:24px;flex-wrap:wrap}
.pg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pg>span{margin-right:4px;color:#A9A9B2}
.pc{height:36px;padding:0 12px;border-radius:8px;border:1px solid #3A3A40;background:#222226;color:#EDEDF0;font:inherit;cursor:pointer}
.pc.on{background:#EDEDF0;color:#111113;border-color:#EDEDF0;font-weight:600}
</style>
