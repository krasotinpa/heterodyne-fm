*{box-sizing:border-box}
html,body{margin:0;background:#0A0A0B;color:#EDEDF0;font-family:'Golos Text',Roboto,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.tn{font-variant-numeric:tabular-nums}
#top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:#17171A;border-bottom:1px solid #2C2C31;font-size:14px}
#top .grp{display:flex;gap:6px;align-items:center}
#top span.l{color:#A9A9B2}
.pc{height:34px;padding:0 12px;border-radius:8px;border:1px solid #3A3A40;background:#222226;color:#EDEDF0;font:inherit}
.pc.on{background:#EDEDF0;color:#111113;border-color:#EDEDF0;font-weight:700}
#note{padding:10px 16px;font-size:14px;color:#C9C9D1;max-width:1100px}
#note b{color:#fff}
#vp{padding:8px 0 4px;overflow:hidden}
#stage{position:relative;width:1100px;height:580px;transform-origin:0 0;background:var(--bg);color:var(--text);border-radius:14px;overflow:hidden;margin-left:16px}
#ctl{display:flex;flex-wrap:wrap;gap:10px 24px;padding:10px 16px 90px;font-size:14px;color:#C9C9D1;align-items:center}
#ctl label{display:flex;gap:8px;align-items:center}
#ctl input[type=range]{width:160px}
#sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:#fff;color:#111;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:100;font-size:15px;font-weight:700}
#sw button{width:40px;height:40px;border-radius:999px;border:0;background:#111;color:#fff;font-size:18px}
#sw .lb{padding:0 12px;min-width:300px;text-align:center}
#states{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 10px}
.stc{padding:10px 12px;border-radius:12px;background:var(--bg);color:var(--text);position:relative;width:268px}
.stc .cap{font-size:12px;color:var(--muted);margin-bottom:6px}
/* ---------- макет «Эфир» ---------- */
.abs{position:absolute}
.btn{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface2);color:var(--text);font-weight:700;font-size:15px;border:0;user-select:none;cursor:pointer;line-height:1.15}
.btn.dis{color:var(--dis);background:var(--surface);cursor:default}
.freq{font-size:60px;line-height:60px;font-weight:600;letter-spacing:-.02em}
.nm{font-size:26px;line-height:32px;font-weight:600}
.sub{font-size:14px;color:var(--muted);font-weight:600}
.plate{height:56px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:17px}
.plate small{font-size:14px;color:var(--muted)}
.plate.pre{background:var(--accentSoft)}
.scale{position:absolute;background:var(--surface);border-radius:12px;touch-action:none;cursor:pointer}
.scale .tick{position:absolute;bottom:22px;width:2px;background:var(--edge);border-radius:1px}
.scale .st{position:absolute;bottom:22px;width:3px;height:24px;background:var(--mark);border-radius:2px}
.scale .pr{position:absolute;bottom:22px;width:5px;height:36px;background:var(--accentText);opacity:.75;border-radius:2px}
.scale .lbl{position:absolute;bottom:2px;font-size:13px;color:var(--muted);font-weight:600}
.scale .base{position:absolute;left:24px;right:24px;bottom:20px;height:2px;background:var(--edge)}
/* маркер */
.mk{position:absolute;bottom:22px;width:0;pointer-events:none}
.mk i,.mk b,.mk svg{position:absolute;display:none}
.v241-0 .mk .s0{display:block;left:-2px;bottom:-2px;width:4px;height:62px;background:var(--accent);border-radius:2px}
.v241-0 .mk .t0{display:block;left:-30px;width:60px;text-align:center;bottom:62px;font-size:14px;font-weight:800;color:var(--accentText)}
.v241-1 .mk .stem{display:block;left:-2px;bottom:-2px;width:4px;height:36px;background:var(--accent);border-radius:2px}
.v241-1 .mk .head{display:block;left:-9px;bottom:30px;width:18px;height:18px;border-radius:50%;background:var(--accent)}
.v241-2 .mk .stem{display:block;left:-1.5px;bottom:-2px;width:3px;height:34px;background:var(--accent)}
.v241-2 .mk .flag{display:block;left:-27px;bottom:32px;width:54px;height:26px;border-radius:8px;background:var(--accent);color:var(--onAccent);font-size:15px;font-weight:800;text-align:center;line-height:26px}
.v241-2 .mk .tri{display:block;left:-6px;bottom:26px;width:0;height:0;border:6px solid transparent;border-top-color:var(--accent);border-bottom:0;bottom:26px}
.v241-3 .mk .halo{display:block;left:-24px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--accentSoft);box-shadow:0 0 0 2px var(--accent) inset}
.v241-3 .mk .stem{display:block;left:-1px;bottom:-2px;width:2px;height:22px;background:var(--accent)}
.v241-3 .mk .head{display:block;left:-7px;bottom:29px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.v241-4 .mk svg.drop{display:block;left:-17px;bottom:-4px;width:34px;height:52px}
#loupehost{z-index:30}.mk .halo{z-index:0}.mk .stem{z-index:1}.mk .head{z-index:2}.mk .flag,.mk .tri{z-index:2}
/* Лупа */
.loupe{position:absolute;height:96px;display:flex;align-items:flex-end;gap:0;pointer-events:none}
.loupe .tip{position:absolute;bottom:-12px;width:0;height:0;border:12px solid transparent;border-top-color:var(--surface2);border-bottom:0;margin-left:-12px}
.loupe .bg{position:absolute;inset:0;background:var(--surface);border-radius:14px;box-shadow:0 14px 30px var(--shadow)}
.lp{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:0 6px;color:var(--text)}
.lp .n{font-size:18px;line-height:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lp .f{font-size:14px;line-height:18px;font-weight:600;color:var(--muted)}
.lp.sel{transform-origin:50% 100%}
.lp.sel .n{font-size:22px;line-height:26px}
.lp.pre .n{color:var(--accentText)}
.v241-0 .lp.sel{transform:scale(1.0)}
.v241-0 .lp.sel::after{content:"";position:absolute;inset:6px 0;border:1.5px solid var(--edge);border-radius:10px}
.v241-1 .lp:not(.sel){opacity:.65}
.v241-1 .lp.sel{background:var(--accent);color:var(--onAccent);border-radius:12px;transform:scale(1.06);box-shadow:0 6px 16px var(--shadow)}
.v241-1 .lp.sel .f{color:var(--onAccent);opacity:.8}
.v241-2 .lp:not(.sel){opacity:.55}
.v241-2 .lp.sel{background:var(--surface2);border-radius:12px;transform:scale(1.06);box-shadow:0 8px 18px var(--shadow)}
.v241-2 .lp.sel::after{content:"";position:absolute;left:10%;right:10%;bottom:6px;height:5px;border-radius:3px;background:var(--accent)}
.v241-3 .lp.sel{border:3px solid var(--accent);border-radius:14px;transform:scale(1.04);background:var(--accentSoft)}
.v241-3 .lp.sel .n{color:var(--accentText)}
.v241-4 .lp.sel{transform:scale(1.04)}
.v241-4 .lp.sel .f{font-size:26px;line-height:28px;font-weight:800;color:var(--accentText);order:-1}
.v241-4 .lp.sel .n{font-size:15px;line-height:18px}
.v241-4 .lp.sel::before,.v241-4 .lp.sel::after{content:"";position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.v241-4 .lp.sel::before{left:0}.v241-4 .lp.sel::after{right:0}
/* ---------- #242 группа ---------- */
.sg{position:relative;width:224px;height:56px;display:flex;align-items:center;gap:8px;border-radius:14px;background:var(--surface);padding:0 4px;overflow:hidden}
.sg .sb{position:relative;width:52px;height:48px;border-radius:10px;background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.sg .lab{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.sg.p .sb{background:var(--surface);color:var(--dis);box-shadow:inset 0 0 0 1.5px var(--edge);opacity:.9}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dp 1s infinite ease-in-out;opacity:.25}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}

.thin{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:calc(var(--p,0)*100%)}
.ring{position:absolute;inset:-3px;border-radius:13px;pointer-events:none}
.sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accentSoft) 40%,var(--accent) 50%,var(--accentSoft) 60%,transparent);width:60%;animation:sw 1s linear infinite;opacity:.9}
@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
.segs{position:absolute;left:8px;right:8px;bottom:3px;height:5px;display:flex;gap:3px}
.segs i{flex:1;border-radius:2px;background:var(--edge);opacity:.5}
.segs i.on{background:var(--accent);opacity:1}
.rs{animation:rd 1s linear infinite}@keyframes rd{to{stroke-dashoffset:-100}}
.spin{position:absolute;inset:-3px;border-radius:13px;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:rot 0.9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.stepbtn{width:96px;height:112px;flex-direction:column;gap:4px}
.stepbtn .arr{font-size:24px}
.stepbtn .pz{font-size:14px;color:var(--dis);font-weight:600}

  h+='<div class="abs" style="left:946px;top:32px">'+btn('<span style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:7px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">P</span>Стоянка</span>',138,56,'', 'font-size:15px')+'</div>';
  h+='<div class="abs" style="left:1018px;top:104px"></div>';
  h+='<div class="abs" style="left:16px;top:164px">'+btn('<span style="display:flex;flex-direction:column;align-items:center"><span style="font-size:34px">◀</span>Станция</span>',96,262)+'</div>';
  h+='<div class="abs" style="left:988px;top:164px">'+btn('<span style="display:flex;flex-direction:column;align-items:center"><span style="font-size:34px">▶</span>Станция</span>',96,262)+'</div>';
  h+='<div class="abs" style="left:16px;top:436px">'+stepHTML(-1)+'</div>';
  h+='<div class="abs" style="left:988px;top:436px">'+stepHTML(1)+'</div>';
  h+='<div class="scale" id="scale" style="left:112px;top:164px;width:'+W+'px;height:84px">'+sc.html+
     (S.q==='241'?markerHTML(S.sel,sc.X):'<div class="mk v241-0" style="left:'+sc.X(S.sel)+'px"><i class="s0" style="display:block;left:-2px;bottom:-2px;width:4px;height:62px;background:var(--accent);border-radius:2px"></i></div>')+'</div>';
  if(S.q==='241'&&(S.ptr!==null||S.pinned)){var f=S.ptr!==null?S.ptr:S.sel;h+='<div class="abs" id="loupehost" style="left:112px;top:164px;width:'+W+'px;height:84px;pointer-events:none">'+loupeHTML(f,sc.X,W)+'</div>';}
  h+='<div class="abs" style="left:112px;top:96px;width:876px;height:56px;border-radius:12px;border:1.5px dashed var(--edge);opacity:.45;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)">место под спектр (в v1 пусто)</div>';
  h+='<div class="abs" style="left:112px;top:260px;width:876px;height:64px;border-radius:12px;background:var(--surface);display:flex;gap:8px;padding:4px 8px;overflow:hidden">'+
    [88.3,88.7,89.1,90.8,96.0,97.2].map(function(f){var s=ST[nearest(f)];return '<div class="plate pre" style="flex:1;height:56px;font-size:15px">'+s[1]+'<small>'+fmt(f)+' FM</small></div>';}).join('')+'</div>';
  h+=plates();
  return h;
}
function groupPlain(){return '<div class="sg"><div class="sb">◀</div><div class="lab">Поиск</div><div class="sb">▶</div></div>';}
/* ---------- шаг ---------- */
function stepHTML(dir){
  var paused=Date.now()<S.stepUntil, v=S.q==='242'?S.v:0;
  var arr=dir<0?'◀':'▶';
  if(v===0) return '<div class="btn stepbtn" data-step="'+dir+'" style="width:96px;height:112px"><span class="arr">'+arr+'</span><span style="font-size:16px">Шаг</span>'+(paused?'<span style="font-size:14px">пауза</span>':'')+'</div>';
  return '<div class="btn stepbtn'+(paused?' dis':'')+'" data-step="'+dir+'" style="width:96px;height:112px"><span class="arr">'+arr+'</span><span style="font-size:16px">Шаг</span></div>';
}
/* ---------- группа «Поиск» ---------- */
function groupState(){
  var now=Date.now(); var m=S.mode;
  if(m==='seek'&&now>=S.tEnd){startPause();m=S.mode;}
  if(m==='pause'&&now>=S.tEnd){S.mode='idle';m='idle';}
  var frac=(m==='pause')?Math.max(0,(S.tEnd-now)/S.tLen):0;
  return {mode:m,dir:S.dir,frac:frac,sec:Math.ceil(Math.max(0,S.tEnd-now)/1000)};
}
function ringCSS(color,frac){return 'background:conic-gradient('+color+' '+(frac*360)+'deg,transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))';}
function groupHTML(v,st){
  var seek=st.mode==='seek', pause=st.mode==='pause';
  var dis=pause||seek;
  var lab='Поиск', extra='', cls='sg'+((v>0&&(pause||seek))?' p':'');
  var L='<div class="sb" data-seek="-1">◀</div>', R='<div class="sb" data-seek="1">▶</div>';
  var pressedRing=function(side){return side;};
  if(v===0){
    lab=seek?'Поиск<span style="color:var(--muted);opacity:.55">…</span>':(pause?'Поиск · пауза':'Поиск');
    return '<div class="sg"><div class="sb" data-seek="-1">◀</div><div class="lab">'+lab+'</div><div class="sb" data-seek="1">▶</div></div>';
  }
  if(v===1){
    lab=seek?'Поиск<span class="dots"><i></i><i></i><i></i></span>':'Поиск';
    if(pause||seek) extra='<i class="thin" style="--p:'+(pause?st.frac:1)+'"></i>';
    return '<div class="'+cls+'"><div class="sb" data-seek="-1">◀</div><div class="lab">'+lab+'</div><div class="sb" data-seek="1">▶</div>'+extra+'</div>';
  }
  if(v===2){
    lab=seek?'<b style="color:var(--accentText);font-size:15px">Идёт поиск</b><span class="dots"><i></i><i></i><i></i></span>':(pause?'<b class="tn" style="color:var(--text);font-size:20px">'+st.sec+' с</b>':'Поиск');
    return '<div class="'+cls+'"><div class="sb" data-seek="-1">◀</div><div class="lab" style="line-height:1.1">'+lab+(pause?'<div style="font-size:12px;color:var(--muted);font-weight:600">до следующего</div>':'')+'</div><div class="sb" data-seek="1">▶</div></div>';
  }
  if(v===3){
    var pressedL=st.dir<0, ring='';
    var svg=function(da,cls){return '<svg style="position:absolute;left:-4px;top:-4px;width:60px;height:56px;pointer-events:none" viewBox="0 0 60 56"><rect x="2" y="2" width="56" height="52" rx="12" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="'+da+'" class="'+cls+'"/></svg>';};
    if(seek) ring=svg('28 72','rs'); else if(pause) ring=svg((st.frac*100)+' 100','');
    var lb='<div class="sb" data-seek="-1">'+(pressedL?ring:'')+'◀</div>', rb='<div class="sb" data-seek="1">'+(!pressedL?ring:'')+'▶</div>';
    return '<div class="'+cls+'" style="overflow:visible">'+lb+'<div class="lab">'+(seek?'<span style="color:var(--accentText);font-weight:800">Поиск</span>':'Поиск')+'</div>'+rb+'</div>';
  }
  if(v===4){
    var segs='';
    if(pause){var total=Math.max(1,Math.round(S.pauseSec));for(var i=0;i<total;i++){segs+='<i class="'+((i<Math.ceil(st.frac*total))?'on':'')+'"></i>';}segs='<div class="segs">'+segs+'</div>';}
    return '<div class="'+cls+'">'+(seek?'<i class="sweep"></i>':'')+'<div class="sb" data-seek="-1" style="position:relative">◀</div><div class="lab" style="position:relative;'+(seek?'color:var(--text);font-weight:800':'')+'">'+(seek?'поиск':'Поиск')+'</div><div class="sb" data-seek="1" style="position:relative">▶</div>'+segs+'</div>';
  }
}
function startSeek(dir){
  var now=Date.now(); if(S.mode!=='idle'||S.driving) return;
  S.mode='seek';S.dir=dir;S.tEnd=now+S.seekSec*1000;S.tLen=S.seekSec*1000;
  if(S.q==='242') S.sel=Math.max(87.5,Math.min(107.8,S.sel+dir*0.4*(1+Math.floor(Math.random()*3))));
}
function startPause(){var now=Date.now();S.mode='pause';S.tLen=S.pauseSec*1000;S.tEnd=now+S.tLen;}
/* ---------- рендер ---------- */
function render(){
  setTheme();
  var st=document.getElementById('stage');
  st.className='v241-'+(S.q==='241'?S.v:0);
  st.innerHTML=efir();
  st.dataset.q=S.q;
  fit();
  document.getElementById('lb').textContent=(S.q==='241'?V241:V242)[S.v];
  document.getElementById('note').innerHTML='<b>'+(S.q==='241'?'#241 · Шкала и Лупа':'#242 · Группа «Поиск»')+'</b> — '+(S.q==='241'?N241:N242)[S.v]+
    (S.q==='241'?'<br><span class="hint">Прижмите палец (мышь) к шкале: появится Лупа. Отпустите — Станция выбрана.</span>':'<br><span class="hint">Нажмите ◀ или ▶ в группе «Поиск», либо «Шаг». Состояния всех вариантов внизу.</span>');
  controls(); statesRow(); topbar();
  if(S.q==='241') bindScale();
  bind242();
}
function fit(){
  var vp=document.getElementById('vp'), k=Math.min(1.6,(window.innerWidth-32)/1100);
  var st=document.getElementById('stage'); st.style.transform='scale('+k+')'; vp.style.height=(580*k+12)+'px';
}
function topbar(){
  var h='<div class="grp"><span class="l">Вопрос</span><button class="pc'+(S.q==='241'?' on':'')+'" data-q="241">#241 Шкала и Лупа</button><button class="pc'+(S.q==='242'?' on':'')+'" data-q="242">#242 Группа «Поиск»</button></div>';
  h+='<div class="grp"><span class="l">Тема</span><button class="pc'+(S.theme==='dark'?' on':'')+'" data-t="dark">Тёмная</button><button class="pc'+(S.theme==='light'?' on':'')+'" data-t="light">Светлая</button></div>';
  h+='<div class="grp"><span class="l">Палитра</span>'+['coral','amber','plum','lime'].map(function(p){return '<button class="pc'+(S.pal===p?' on':'')+'" data-p="'+p+'">'+PAL[p].name+'</button>';}).join('')+'</div>';
  document.getElementById('top').innerHTML=h;
  [].forEach.call(document.querySelectorAll('#top [data-q]'),function(b){b.onclick=function(){S.q=b.dataset.q;S.v=1;S.mode='idle';S.ptr=null;url();render();};});
  [].forEach.call(document.querySelectorAll('#top [data-t]'),function(b){b.onclick=function(){S.theme=b.dataset.t;url();render();};});
  [].forEach.call(document.querySelectorAll('#top [data-p]'),function(b){b.onclick=function(){S.pal=b.dataset.p;url();render();};});
}
function controls(){
  var h='';
  if(S.q==='241'){h+='<label><input type="checkbox" id="pin"'+(S.pinned?' checked':'')+'> Держать Лупу открытой на выбранной Станции</label>';}
  else{
    h+='<label>Длительность поиска, с <input type="range" id="sk" min="0.5" max="20" step="0.5" value="'+S.seekSec+'"><b class="tn">'+S.seekSec+'</b> (на ГУ реально 0,5; предел до 20)</label>';
    h+='<label>Пауза после поиска, с <input type="range" id="ps" min="1" max="8" step="0.5" value="'+S.pauseSec+'"><b class="tn">'+S.pauseSec+'</b> (сейчас 5; предложение 2,5 не принято, см. #237)</label>';
    h+='<label>Пауза «Шаг», мс <input type="range" id="sp" min="250" max="1000" step="50" value="'+S.stepMs+'"><b class="tn">'+S.stepMs+'</b></label>';
    h+='<label><input type="checkbox" id="drv"'+(S.driving?' checked':'')+'> На ходу (группа скрыта)</label>';
  }
  document.getElementById('ctl').innerHTML=h;
  var pin=document.getElementById('pin'); if(pin) pin.onchange=function(){S.pinned=pin.checked;render();};
  var sk=document.getElementById('sk'); if(sk) sk.oninput=function(){S.seekSec=+sk.value;sk.nextElementSibling.textContent=sk.value;};
  var ps=document.getElementById('ps'); if(ps) ps.oninput=function(){S.pauseSec=+ps.value;ps.nextElementSibling.textContent=ps.value;};
  var sp=document.getElementById('sp'); if(sp) sp.oninput=function(){S.stepMs=+sp.value;sp.nextElementSibling.textContent=sp.value;};
  var dr=document.getElementById('drv'); if(dr) dr.onchange=function(){S.driving=dr.checked;render();};
}
function statesRow(){
  var el=document.getElementById('states'); if(S.q!=='242'){el.innerHTML='';return;}
  var cases=[['Покой',{mode:'idle',dir:1,frac:0,sec:0}],['Идёт поиск',{mode:'seek',dir:1,frac:1,sec:0}],['Пауза: осталось 4 с',{mode:'pause',dir:1,frac:.8,sec:4}],['Пауза: осталось 1 с',{mode:'pause',dir:-1,frac:.2,sec:1}]];
  el.innerHTML=cases.map(function(c){return '<div class="stc"><div class="cap">'+c[0]+'</div>'+groupHTML(S.v,c[1])+'</div>';}).join('');
}
function bind242(){
  if(S.q!=='242') return;
  [].forEach.call(document.querySelectorAll('#stage [data-seek]'),function(b){b.onclick=function(){startSeek(+b.dataset.seek);render();};});
  [].forEach.call(document.querySelectorAll('#stage [data-step]'),function(b){b.onclick=function(){if(Date.now()<S.stepUntil)return;S.stepUntil=Date.now()+S.stepMs;S.sel=Math.max(87.5,Math.min(107.8,S.sel+(+b.dataset.step)*0.1));render();};});
}
function bindScale(){
  var el=document.getElementById('scale'); if(!el) return;
  var k=parseFloat(document.getElementById('stage').style.transform.replace('scale(',''))||1;
  var info=scaleHTML(876), inset=TOKENS.size.scale.inset, span=876-2*inset;
  function fOf(e){var r=el.getBoundingClientRect();var x=(e.clientX-r.left)/k;return Math.max(87.5,Math.min(108,87.5+(x-inset)/span*20.5));}
  el.onpointerdown=function(e){el.setPointerCapture(e.pointerId);S.ptr=fOf(e);S.sel=ST[nearest(S.ptr)][0];render();};
  el.onpointermove=function(e){if(S.ptr===null)return;S.ptr=fOf(e);S.sel=ST[nearest(S.ptr)][0];soft();};
  el.onpointerup=function(e){S.sel=ST[nearest(S.ptr===null?S.sel:S.ptr)][0];S.ptr=null;render();};
  el.onpointercancel=function(){S.ptr=null;render();};
}
var pend=false;function soft(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;render2();});}
function render2(){ /* перерисовка без потери захвата указателя */
  var st=document.getElementById('stage'); var sc=document.getElementById('scale');
  var info=scaleHTML(876);
  var mk=sc.querySelector('.mk'); if(mk) mk.outerHTML=markerHTML(S.sel,info.X);
  var host=document.getElementById('loupehost');
  if(!host){host=document.createElement('div');host.id='loupehost';host.className='abs';host.style.cssText='left:112px;top:164px;width:876px;height:84px;pointer-events:none';st.appendChild(host);}
  host.innerHTML=loupeHTML(S.ptr!==null?S.ptr:S.sel,info.X,876);
  document.querySelector('.freq').textContent=fmt(S.sel);document.querySelector('.nm').textContent=ST[nearest(S.sel)][1];
}
function url(){var u=new URL(location.href);u.searchParams.set('q',S.q);u.searchParams.set('v',S.v);u.searchParams.set('t',S.theme);u.searchParams.set('p',S.pal);history.replaceState(null,'',u);}
function go(d){var n=(S.q==='241'?V241:V242).length;S.v=(S.v+d+n)%n;S.mode='idle';url();render();}
document.getElementById('pv').onclick=function(){go(-1)};document.getElementById('nx').onclick=function(){go(1)};
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
window.addEventListener('resize',fit);
/* анимация таймера #242 */
setInterval(function(){
  if(S.q!=='242') return;
  var wrap=document.getElementById('sgwrap'); if(!wrap||S.driving) return;
  var prev=S.mode, st=groupState();
  wrap.innerHTML=groupHTML(S.v,st);
  [].forEach.call(wrap.querySelectorAll('[data-seek]'),function(b){b.onclick=function(){startSeek(+b.dataset.seek);render();};});
  if(Date.now()>=S.stepUntil&&S.stepUntil){S.stepUntil=0;render();}
},100);
render();
</script>
</body>
